dataset:
  name: DATASET_NAME
  full_name: "Full Dataset Name"
  description: "Brief description of the dataset and its research purpose"

source:
  type: pubmed_collection          # or: web_of_science, manual_pmid_list
  collection_id: null              # PubMed collection ID if applicable
  collection_url: null             # URL to citation source
  expected_paper_count: null       # Update after first fetch
  last_fetched: null               # ISO date, set by pipeline

metrics:
  top_x_values: [1, 3, 5, 10]
  compute_by_year: true

paths:
  raw_dir: raw
  processed_dir: processed
  output_dir: output
